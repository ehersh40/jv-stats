<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1318">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JV Stats">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <title>JV Stats</title>
</head>
<body>
  <main id="app" aria-live="polite"></main>

  <nav id="tabs" aria-label="Main">
    <button data-action="nav" data-view="games">
      <span class="tab-ico">🏀</span><span>Games</span>
    </button>
    <button data-action="nav" data-view="roster">
      <span class="tab-ico">👥</span><span>Roster</span>
    </button>
    <button data-action="nav" data-view="settings">
      <span class="tab-ico">⚙️</span><span>Settings</span>
    </button>
  </nav>

  <div id="toast" role="status"></div>
  <dialog id="modal"></dialog>

  <script src="app.js"></script>
</body>
</html>
